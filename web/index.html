<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronoplot</title>
    <meta name="description" content="Build beautiful, printable timelines in the browser." />

    <!--
      The product mark as the tab icon: three stacked bars on a shared baseline,
      the same glyph the dashboard shows. Inlined as a data URI so it needs no
      request and cannot 404.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4.5' fill='%236d8cff'/%3E%3Crect x='3' y='4.4' width='9' height='2.8' rx='1.4' fill='%2307091a' opacity='.95'/%3E%3Crect x='5.5' y='8.6' width='10.5' height='2.8' rx='1.4' fill='%2307091a' opacity='.65'/%3E%3Crect x='3' y='12.8' width='6.5' height='2.8' rx='1.4' fill='%2307091a' opacity='.4'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
       * Applied before first paint so the app never flashes the default theme.
       * The stored value is re-validated by the theme provider once React runs.
       */
      try {
        var stored = localStorage.getItem("chronoplot.theme");
        var known = ["midnight", "eclipse", "abyss", "daylight", "parchment"];
        if (stored && known.indexOf(stored) !== -1) {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {
        /* Private mode or blocked storage: the default theme is correct. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
