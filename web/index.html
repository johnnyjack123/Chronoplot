<!doctype html>
<html lang="en" data-theme="midnight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronoplot</title>
    <meta name="description" content="Build beautiful, printable timelines in the browser." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      /*
       * Applied before first paint so the app never flashes the default theme.
       * The stored value is re-validated by the theme provider once React runs.
       */
      try {
        var stored = localStorage.getItem("chronoplot.theme");
        var known = ["midnight", "eclipse", "abyss", "daylight", "parchment"];
        if (stored && known.indexOf(stored) !== -1) {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {
        /* Private mode or blocked storage: the default theme is correct. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
