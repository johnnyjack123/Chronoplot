# Build, test, and publish a multi-architecture image.
#
# Each architecture is built on a machine of that architecture and published by
# digest; a final job stitches the digests into one tagged manifest. Emulation
# is avoided entirely - see the README for why that matters the moment a
# dependency has to be compiled rather than downloaded.
#
# The image jobs depend on the test job, so a push that breaks the suite never
# produces a tagged image. Images go to the GitHub Container Registry attached
# to this repository; no secret is needed, because GITHUB_TOKEN can write to it
# given the `packages: write` permission each job declares.
#
# If the repository ever becomes private, `ubuntu-24.04-arm` stops being free.
# Either add a paid runner or fall back to a single QEMU job with
# `platforms: linux/amd64,linux/arm64`.

name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Typecheck, unit tests, smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit suites
        run: |
          for suite in dates axis reorder packing pdf-plan html-export; do
            echo "--- $suite"
            npx tsx --tsconfig web/tsconfig.json "web/test/$suite.test.ts"
          done
          echo "--- reconcile"
          npx tsx --tsconfig server/tsconfig.json server/test/reconcile.test.ts

      - name: Smoke test against the production build
        env:
          NODE_ENV: production
          DATABASE_URL: /tmp/ci-smoke.sqlite
          APP_ORIGIN: http://localhost:5188
          PORT: "5188"
        run: |
          # Generated per run rather than written into the file. This server
          # lives for one job and is unreachable from outside it, so a literal
          # would be harmless - but nothing credential-shaped belongs in a
          # repository, if only so that scanning for such things stays useful.
          export SESSION_SECRET="$(openssl rand -hex 32)"
          npm start &

          # Wait for the port rather than sleeping a guessed number of seconds.
          for _ in $(seq 1 40); do
            curl -fsS http://localhost:5188/api/health >/dev/null 2>&1 && break
            sleep 0.5
          done

          # No trap, no captured exit status: `run` blocks execute under
          # `bash -e`, so a failing test aborts the step here and the runner
          # tears the server down with the job.
          BASE=http://localhost:5188 ORIGIN=http://localhost:5188 node server/test/smoke.mjs

      - name: First run with registration closed
        env:
          NODE_ENV: production
          DATABASE_URL: /tmp/ci-first-run.sqlite
          APP_ORIGIN: http://localhost:5187
          PORT: "5187"
          ALLOW_REGISTRATION: "false"
        run: |
          export SESSION_SECRET="$(openssl rand -hex 32)"
          npm start &
          for _ in $(seq 1 40); do
            curl -fsS http://localhost:5187/api/health >/dev/null 2>&1 && break
            sleep 0.5
          done
          BASE=http://localhost:5187 ORIGIN=http://localhost:5187 node server/test/first-run.mjs

  plugin:
    name: Obsidian plugin
    runs-on: ubuntu-latest
    # Its own job because it has its own dependency tree: the plugin sits
    # outside the npm workspaces, so the root `npm ci` never sees it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json

      - run: npm ci
        working-directory: obsidian-plugin

      - name: Typecheck and bundle
        run: npm run build
        working-directory: obsidian-plugin

      - run: npm test
        working-directory: obsidian-plugin

      # main.js is committed so the plugin can be installed with a git pull
      # alone. If the build produces something different, the committed copy is
      # stale and whoever installs it gets the previous version.
      - name: The committed bundle matches the source
        run: |
          if ! git diff --quiet -- main.js; then
            echo "obsidian-plugin/main.js is out of date. Run 'npm run build' in obsidian-plugin/ and commit it."
            git diff --stat -- main.js
            exit 1
          fi
        working-directory: obsidian-plugin

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    # Pull requests from forks cannot write packages, and there is nothing to
    # publish from a proposal anyway.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase image names, and a repository name is free to
      # contain them. Deriving the name instead of hard-coding it keeps the
      # workflow correct if the repository is ever renamed or forked.
      - name: Derive the image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only for the labels. `org.opencontainers.image.source` is what makes
      # GitHub attach the package to this repository rather than leaving it
      # floating under the account, so it has to be on the per-architecture
      # images - the manifest list carries no labels of its own.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      # Published by digest, not by tag: two jobs pushing the same tag would
      # each overwrite the other's architecture. The manifest job below turns
      # the digests into one tag that carries both.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.image.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.image.outputs.slug }}

      # The file is named after the digest, with the `sha256:` prefix stripped:
      # upload-artifact rejects any path containing a colon, because it is not a
      # legal filename on Windows. The manifest job puts the prefix back.
      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.image.outputs.slug }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: Publish the multi-arch tag
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Derive the image name
        id: image
        run: |
          echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # One manifest list per tag, listing both architecture digests. Docker
      # then serves whichever entry matches the puller's platform.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Show what was published
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
