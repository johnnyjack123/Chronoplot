# Chronoplot.
#
#   docker build -t chronoplot:latest .   # produce the image
#   cp env.example .env                   # set SESSION_SECRET to something random
#   docker compose up -d                  # run it
#
# Building and running are separate on purpose: this file only describes how to
# run an image, so the same image can be built once, pushed to a registry, and
# run anywhere. The tag below is what `docker build` must produce.
#
# Every value below comes from the environment at *run* time. Nothing secret is
# ever built into the image: .env is excluded from the build context, so it
# cannot be copied in even by accident.
#
# Compose reads `.env` from this directory to resolve the ${...} references
# below - the same file the server reads when run without Docker, so there is
# one place to configure either way.
#
# Put SESSION_SECRET in that file rather than passing it on the command line.
# It signs the CSRF tokens, so a fresh random value on every start would reject
# every already-open browser tab with a 403 until it reloaded.
#
# The server refuses to start in production without a SESSION_SECRET of at
# least 32 characters, which is deliberate - a weak one means forgeable tokens.

services:
  chronoplot:
    image: chronoplot:latest
    restart: unless-stopped
    ports:
      - "5174:5174"
    environment:
      NODE_ENV: production
      PORT: 5174
      # Where the browser reaches this instance. Must match exactly, including
      # scheme and port - the origin check and the cookie scope both use it.
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5174}
      SESSION_SECRET: ${SESSION_SECRET:?put SESSION_SECRET in .env - see the note at the top}
      # Fixed, not configurable. This is read exactly once - on the first boot
      # of an empty database - to seed a setting the admin screen owns from then
      # on. Exposing it as a variable invites the belief that it still does
      # something later, which it does not.
      #
      # Closed is the only safe starting position for a deployment: the first
      # account to register becomes the administrator, so an instance briefly
      # open on a public address is one a stranger can take ownership of. It
      # costs nothing, because the first account is let in regardless and can
      # open registration from the admin screen afterwards.
      ALLOW_REGISTRATION: "false"
      # Set here, not taken from .env: the path inside the container has to be
      # the volume. A host path copied in from .env would put the database on a
      # container layer, where it disappears with the container.
      DB_DRIVER: sqlite
      DATABASE_URL: /data/chronoplot.sqlite
    volumes:
      # The database, and the backups taken from inside the container. Losing
      # this volume loses every project, so take a copy off it regularly:
      #   docker compose exec chronoplot node scripts/backup-db.mjs /data/chronoplot.sqlite
      #   docker compose cp chronoplot:/data/backups ./backups
      - chronoplot-data:/data

  # Uncomment to run against Postgres instead. Only these two variables change;
  # the schema is created on boot and no code differs.
  #
  # postgres:
  #   image: postgres:17-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: chronoplot
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #     POSTGRES_DB: chronoplot
  #   volumes:
  #     - chronoplot-pg:/var/lib/postgresql/data
  #
  # Then on the chronoplot service:
  #   DB_DRIVER: postgres
  #   DATABASE_URL: postgres://chronoplot:${POSTGRES_PASSWORD}@postgres:5432/chronoplot

volumes:
  chronoplot-data:
  # chronoplot-pg:
